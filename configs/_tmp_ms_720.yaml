augmentations:
  affine_scale:
  - 0.9
  - 1.1
  affine_translate:
  - 0.08
  - 0.08
  blur:
    blur_limit:
    - 3
    - 7
    p: 0.35
    sigma_limit:
    - 0.2
    - 1.0
  brightness_contrast:
  - 0.12
  - 0.12
  color_jitter:
    brightness: 0.3
    contrast: 0.15
    hue: 0.02
    p: 0.4
    saturation: 0.2
  horizontal_flip: true
  horizontal_flip_prob: 0.5
  max_rotate: 12
  name: rot90_jitter_affine_rrc
  random_resized_crop_ratio:
  - 0.85
  - 1.15
  random_resized_crop_scale:
  - 0.92
  - 1.0
  random_rotate90: true
  random_rotate90_prob: 0.5
  rotate_prob: 1.0
  use_reference_pipeline: true
data:
  excluded_ids: []
  input_size: 720
  loader:
    batch_size: 6
    num_workers: 8
    persistent_workers: true
    pin_memory: true
    prefetch_factor: 2
  mean:
  - 0.485
  - 0.456
  - 0.406
  num_classes: 17
  std:
  - 0.229
  - 0.224
  - 0.225
experiment:
  deterministic: false
  name: efficientnet_b7_offline_448
  seed: 2024
logging:
  log_interval: 50
  project: document_type_classification
  tensorboard: true
loss:
  label_smoothing: 0.05
  name: cross_entropy
model:
  drop_path_rate: 0.2
  drop_rate: 0.4
  name: tf_efficientnet_b7_ns
  pretrained: true
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.0002
  name: adamw
  weight_decay: 0.02
paths:
  data_root: data/processed/offline_aug
  image_dir: data/processed/offline_aug/images
  meta_csv: data/raw/meta.csv
  output_root: outputs
  test_dir: data/raw/test
  train_csv: data/processed/offline_aug/train_offline_aug.csv
performance:
  allow_tf32: true
  channels_last: true
  cudnn_benchmark: true
  matmul_precision: high
regularization:
  cutmix_alpha: 0.0
  mixup_alpha: 0.1
  tag: mixup_only
sampler:
  minority_classes:
  - 1
  - 13
  - 14
  name: weighted_random
  replacement: true
  weights_power: 0.85
scheduler:
  min_lr: 1.0e-06
  name: cosine
  warmup_epochs: 2
split:
  fold_index: 0
  n_splits: 6
  predefined_split: splits/fold_indices_offline.pkl
  seed: 2024
submission:
  leaderboard_score: 0.0
  metric_name: f1
  tta:
    enabled: true
    horizontal_flip: true
    jitter_degrees: 0
    rotations:
    - 0
    - 90
    - 180
    - 270
    vertical_flip: false
training:
  amp: true
  early_stopping: null
  ema:
    enabled: false
  epochs: 6
  grad_clip_norm: 1.0
  save_best_metric: f1
  swa:
    enabled: false
  validation_interval: 1
