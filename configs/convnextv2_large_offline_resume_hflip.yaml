experiment:
  name: convnextv2_large_offline_resume_hflip
  seed: 2024
  deterministic: false

paths:
  data_root: data/processed/offline_aug
  train_csv: data/processed/offline_aug/train_offline_aug.csv
  meta_csv: data/raw/meta.csv
  image_dir: data/processed/offline_aug/images
  test_dir: data/raw/test
  output_root: outputs

data:
  num_classes: 17
  input_size: 384
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  excluded_ids: []
  loader:
    batch_size: 10
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

split:
  n_splits: 6
  fold_index: 0
  seed: 2024
  predefined_split: splits/fold_indices_offline.pkl

sampler:
  name: weighted_random
  minority_classes: [1, 13, 14]
  weights_power: 0.85
  replacement: true

augmentations:
  name: rot90_jitter_affine_rrc
  use_reference_pipeline: true

regularization:
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  tag: no-reg

model:
  name: convnextv2_large.fcmae_ft_in22k_in1k
  pretrained: true
  drop_path_rate: 0.3
  checkpoint: outputs/runs/20251108-070118_convnextv2_large.fcmae_ft_in22k_in1k_384px_rot90_jitter_affine_rrc_no-reg_ls0.05_cosine/checkpoints/best_model_state.pth

loss:
  name: cross_entropy
  label_smoothing: 0.05

optimizer:
  name: adamw
  lr: 0.00003
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 1
  min_lr: 1.0e-6

training:
  epochs: 2
  amp: true
  grad_clip_norm: null
  save_best_metric: f1
  validation_interval: 1
  early_stopping: null
  ema:
    enabled: false
  swa:
    enabled: false

logging:
  project: document_type_classification
  log_interval: 50
  tensorboard: true

submission:
  metric_name: f1
  leaderboard_score: 0.0
  tta:
    enabled: true
    rotations: [0, 90, 180, 270]
    jitter_degrees: 0
    horizontal_flip: true
    vertical_flip: false

performance:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  channels_last: true
