experiment:
  name: dit_base_patch16_224
  seed: 2024
  deterministic: false

paths:
  data_root: data/raw
  train_csv: data/raw/train.csv
  meta_csv: data/raw/meta.csv
  image_dir: data/raw/train
  test_dir: data/raw/test
  output_root: outputs

data:
  num_classes: 17
  input_size: 224
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  excluded_ids:
    - 2b1076abe3e4338d.jpg
    - a5ea50be18045857.jpg
    - 024fe478044874ab.jpg
  loader:
    batch_size: 6
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

split:
  n_splits: 6
  fold_index: 1
  seed: 2024
  predefined_split: splits/fold_indices_v1.pkl

sampler:
  name: weighted_random
  minority_classes: [1, 13, 14]
  weights_power: 0.85
  replacement: true

augmentations:
  name: rot90_jitter_affine_rrc
  random_resized_crop_scale: [0.9, 1.0]
  random_resized_crop_ratio: [0.9, 1.1]
  random_rotate90: true
  random_rotate90_prob: 1.0
  max_rotate: 12
  rotate_prob: 1.0
  affine_scale: [0.95, 1.05]
  affine_translate: [0.05, 0.05]
  horizontal_flip: true
  horizontal_flip_prob: 0.5
  brightness_contrast: [0.1, 0.1]
  blur_prob: 0.0

regularization:
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  tag: no-reg

model:
  name: hf_dit_base
  provider: huggingface
  hf_name: microsoft/dit-base
  gradient_checkpointing: true
  image_size: 224
  checkpoint: null

loss:
  name: cross_entropy
  label_smoothing: 0.05

optimizer:
  name: adamw
  lr: 0.00005
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 5
  min_lr: 1.0e-6

training:
  epochs: 20
  amp: true
  grad_clip_norm: null
  save_best_metric: f1
  validation_interval: 1
  early_stopping:
    patience: 3
    min_delta: 0.0005
    mode: max
  ema:
    enabled: false
  swa:
    enabled: false

logging:
  project: document_type_classification
  log_interval: 50

submission:
  metric_name: f1
  leaderboard_score: 0.0
  tta:
    enabled: true
    rotations: [0, 90, 180, 270]
    jitter_degrees: 0

performance:
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  channels_last: true
